name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty. Add a granular npm token with read/write access to the @zhuixin scope and 'bypass 2FA' enabled."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org/
      - name: Validate publish contents
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_DRY_RUN: "1"
          PUBLISH_PROVENANCE: "0"
        run: node scripts/publish.mjs
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          node scripts/publish.mjs 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(grep -Ei 'npm (error|ERR)|ERR_PNPM|EOTP|E40[0-9]|E42[0-9]|OTP|unauthorized|forbidden|one-time password' publish.log | head -n 15 | tr '\r\n' '  ' | cut -c1-4000)
            if [ -z "$message" ]; then
              message=$(sed -n '/== Publishing/,/== Publish summary/p' publish.log | head -n 40 | tr '\r\n' '  ' | cut -c1-4000)
            fi
            echo "::error title=npm publish failed::$message"
          fi
          exit "$status"
